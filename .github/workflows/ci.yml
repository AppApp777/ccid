name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS 15 builds with Xcode 16 (the look before Liquid Glass), macOS 26 with Xcode 26.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test
      - run: scripts/build-app.sh
